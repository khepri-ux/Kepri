<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diário de Missões</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d0b16" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Missões" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1a1730 0%, #0d0b16 55%, #08070d 100%);
    color: #E8E3D3;
    font-family: 'Inter', system-ui, sans-serif;
    padding-bottom: 3rem;
  }
  .header {
    border-bottom: 1px solid rgba(201,162,39,0.25);
    background: linear-gradient(180deg, rgba(201,162,39,0.06), transparent);
    padding: 1.75rem 1.25rem 1.5rem;
  }
  .header-inner, .main { max-width: 820px; margin: 0 auto; }
  .main { padding: 1.5rem 1.25rem; }
  .title-row { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.25rem; }
  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    margin: 0;
    color: #F0E6C8;
  }
  .subtitle { margin: 0 0 1.1rem 0; font-size: 0.85rem; color: #9A94AE; }
  .stats-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .level-badge {
    width: 3rem; height: 3rem; border-radius: 0.6rem;
    border: 2px solid #C9A227; display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.1rem; color: #F0E6C8;
    background: rgba(201,162,39,0.1); flex-shrink: 0;
  }
  .bar-wrap { flex: 1; min-width: 180px; position: relative; }
  .bar-labels {
    display: flex; justify-content: space-between; font-size: 0.7rem; color: #9A94AE;
    margin-bottom: 0.3rem; font-family: 'JetBrains Mono', monospace;
  }
  .bar-track {
    height: 0.55rem; border-radius: 999px; background: #1E1B30; overflow: hidden;
    border: 1px solid rgba(201,162,39,0.2);
  }
  .bar-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #8a6d1f, #C9A227, #E8C766);
    transition: width 0.5s ease-out;
  }
  .streak { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; color: #9A94AE; font-family: 'JetBrains Mono', monospace; }
  .add-btn {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 0.65rem 1rem; border-radius: 0.5rem; border: 1px dashed rgba(201,162,39,0.4);
    background: transparent; color: #C9A227; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; width: 100%; margin-bottom: 1.75rem; font-family: inherit;
  }
  .form-panel {
    border: 1px solid rgba(201,162,39,0.3); border-radius: 0.6rem; padding: 1rem;
    margin-bottom: 1.75rem; background: rgba(201,162,39,0.04); display: none;
  }
  .form-panel.open { display: block; }
  .form-panel input[type=text] {
    width: 100%; background: #14111f; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 0.4rem; padding: 0.6rem 0.75rem; color: #E8E3D3; font-size: 0.9rem;
    margin-bottom: 0.75rem; outline: none; font-family: inherit;
  }
  .form-panel textarea {
    width: 100%; background: #14111f; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 0.4rem; padding: 0.6rem 0.75rem; color: #E8E3D3; font-size: 0.82rem;
    margin-bottom: 0.75rem; outline: none; font-family: inherit; resize: vertical;
    min-height: 4.5rem; line-height: 1.4;
  }
  .field-label {
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: #6b6580; margin-bottom: 0.35rem;
  }
  .toggle-row, .diff-row, .seg-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .diff-row { margin-bottom: 1rem; }
  .toggle-btn, .diff-btn, .seg-btn {
    flex: 1 1 auto; padding: 0.4rem 0.75rem; border-radius: 0.4rem;
    border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #9A94AE;
    font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 0.35rem; font-family: inherit;
  }
  .diff-btn { font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; font-weight: 500; }
  .toggle-btn.active-main { border-color: #55503f; background: #0c0b10; color: #D8D2C0; box-shadow: inset 0 0 0 1px rgba(216,210,192,0.06); }
  .toggle-btn.active-side { border-color: #9A94AE; background: rgba(154,148,174,0.12); color: #C9C4D6; }
  .diff-btn.active { border-color: #C9A227; background: rgba(201,162,39,0.1); color: #E8C766; }
  .form-actions { display: flex; gap: 0.5rem; }
  .submit-btn {
    flex: 1; padding: 0.55rem; border-radius: 0.4rem; border: none; background: #C9A227;
    color: #1a1508; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit;
  }
  .cancel-btn {
    padding: 0.55rem 0.9rem; border-radius: 0.4rem; border: 1px solid rgba(255,255,255,0.15);
    background: transparent; color: #9A94AE; font-size: 0.85rem; cursor: pointer; font-family: inherit;
  }
  .section { margin-bottom: 1.75rem; }
  .section-title-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.7rem; }
  .section-title { font-family: 'Cinzel', serif; font-size: 0.95rem; font-weight: 600; color: #E8E3D3; }
  .section-count { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: #6b6580; }
  .empty-box {
    padding: 1rem; border-radius: 0.5rem; border: 1px dashed rgba(255,255,255,0.1);
    color: #6b6580; font-size: 0.82rem;
  }
  .quest-list { display: flex; flex-direction: column; gap: 0.55rem; }
  .quest-card {
    display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 0.85rem;
    border-radius: 0.55rem; border: 1px solid rgba(255,255,255,0.08); border-left-width: 3px;
    border-left-style: solid; transition: transform 0.15s ease;
  }
  .quest-card:hover { transform: translateY(-2px); }
  .quest-check {
    width: 1.6rem; height: 1.6rem; border-radius: 0.35rem; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0; border-width: 1.5px; border-style: solid; font-size: 0.9rem; line-height: 1;
  }
  .quest-icon { flex-shrink: 0; font-size: 0.85rem; opacity: 0.85; }
  .quest-body { flex: 1; min-width: 0; }
  .quest-title { font-size: 0.88rem; color: #E8E3D3; word-break: break-word; }
  .quest-meta { display: flex; align-items: center; gap: 0.45rem; margin-top: 0.25rem; }
  .quest-seg-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 0.04em;
    text-transform: uppercase; padding: 0.05rem 0.4rem; border-radius: 999px; border-width: 1px; border-style: solid;
  }
  .quest-stars { font-size: 0.65rem; }
  .quest-notes-toggle {
    background: transparent; border: none; color: #6b6580; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; padding: 0; margin-top: 0.3rem;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .quest-notes {
    margin-top: 0.4rem; font-size: 0.78rem; line-height: 1.45; color: #B8B2C8;
    white-space: pre-wrap; word-break: break-word; border-left: 2px solid rgba(255,255,255,0.1);
    padding-left: 0.6rem; display: none;
  }
  .quest-notes.open { display: block; }
  .quest-date {
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: #5a5568;
    margin-top: 0.3rem;
  }
  .log-item {
    display: block; padding: 0.6rem 0.75rem; border-radius: 0.4rem;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
  }
  .log-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .log-top-left { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
  .log-icon { flex-shrink: 0; font-size: 0.8rem; opacity: 0.8; }
  .log-title { font-size: 0.82rem; text-decoration: line-through; opacity: 0.6; word-break: break-word; }
  .log-dates {
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: #5a5568;
    margin-top: 0.35rem; display: flex; flex-direction: column; gap: 0.1rem;
  }
  .quest-xp { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; align-self: flex-start; }
  .quest-remove {
    background: transparent; border: none; color: #6b6580; cursor: pointer;
    padding: 0.15rem; flex-shrink: 0; font-size: 1rem; line-height: 1;
  }
  .toast {
    position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 50;
    padding: 0.6rem 1.1rem; border-radius: 0.5rem; background: #161327;
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 600;
    letter-spacing: 0.02em; box-shadow: 0 8px 24px rgba(0,0,0,0.5); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease; border: 1px solid #3FA9A0; color: #7FD9CF;
  }
  .toast.levelup { border-color: #C9A227; color: #E8C766; }
  .toast.show { opacity: 1; }
  .floater {
    position: absolute; right: 0.2rem; top: -0.5rem; font-family: 'JetBrains Mono', monospace;
    font-weight: 600; font-size: 0.8rem; color: #E8C766; animation: floatUp 1.2s ease-out forwards;
    pointer-events: none;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0px) scale(0.8); }
    15% { opacity: 1; transform: translateY(-6px) scale(1); }
    100% { opacity: 0; transform: translateY(-46px) scale(1); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="title-row">
      <span style="color:#C9A227;">📜</span>
      <h1>Diário de Missões</h1>
    </div>
    <p class="subtitle">Ordem, Ofício e Ágape. Cada missão pertence a um segmento e a um grau de importância.</p>
    <div class="stats-row">
      <div class="level-badge" id="levelBadge">1</div>
      <div class="bar-wrap">
        <div class="bar-labels">
          <span id="levelLabel">NÍVEL 1</span>
          <span id="xpLabel">0 / 3300 XP</span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%;"></div></div>
        <div id="floaterHost"></div>
      </div>
      <div class="streak">🔥 <span id="completedCount">0</span> concluídas</div>
    </div>
  </div>
</div>

<div class="main">
  <button class="add-btn" id="openFormBtn">+ Nova missão</button>

  <form class="form-panel" id="formPanel">
    <input type="text" id="tituloInput" placeholder="O que precisa ser feito?" />

    <div class="field-label">Notas (opcional)</div>
    <textarea id="notasInput" placeholder="Instruções, contexto ou como fazer isso certo da próxima vez..."></textarea>

    <div class="field-label">Importância</div>
    <div class="toggle-row">
      <button type="button" class="toggle-btn active-main" id="tipoPrincipalBtn">⚔ Missão principal</button>
      <button type="button" class="toggle-btn" id="tipoSecundariaBtn">🛡 Missão secundária</button>
    </div>

    <div class="field-label">Segmento</div>
    <div class="seg-row" id="segRow"></div>

    <div class="field-label">Dificuldade</div>
    <div class="diff-row" id="diffRow"></div>

    <div class="form-actions">
      <button type="submit" class="submit-btn">Registrar missão</button>
      <button type="button" class="cancel-btn" id="cancelBtn">Cancelar</button>
    </div>
  </form>

  <div class="section">
    <div class="section-title-row">
      <span style="color:#C9A227;">⚔</span>
      <span class="section-title">Missão Principal</span>
      <span class="section-count" id="principaisCount">(0)</span>
    </div>
    <div id="principaisList"></div>
  </div>

  <div class="section">
    <div class="section-title-row">
      <span style="color:#9A94AE;">🛡</span>
      <span class="section-title">Missões Secundárias</span>
      <span class="section-count" id="secundariasCount">(0)</span>
    </div>
    <div id="secundariasList"></div>
  </div>

  <div class="section" id="logSection" style="display:none;">
    <div style="font-family:'Cinzel', serif; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; color:#6b6580; margin-bottom:0.6rem;">
      Registro de conquistas recentes
    </div>
    <div class="quest-list" id="logList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'diario-missoes-standalone-v1';

const DIFFICULTY = {
  facil:   { label: 'Fácil',   xp: 1, stars: 1 },
  medio:   { label: 'Médio',   xp: 3, stars: 2 },
  dificil: { label: 'Difícil', xp: 5, stars: 3 },
};

// tons ajustados para combinar com o dourado (#C9A227) e o fundo roxo-escuro já usados
const SEGMENTOS = {
  ordem:  { label: 'Ordem',  borda: '#B8534A', texto: '#E29A8C', bg: 'rgba(184,83,74,0.09)' },
  oficio: { label: 'Ofício', borda: '#4C7BB0', texto: '#93B8E0', bg: 'rgba(76,123,176,0.09)' },
  agape:  { label: 'Ágape',  borda: '#4F9070', texto: '#8FD3AE', bg: 'rgba(79,144,112,0.09)' },
};

const XP_POR_NIVEL = 3300;

let state = { quests: [], xpTotal: 0 };
let novoTipo = 'principal';
let novoSegmento = 'ordem';
let novaDificuldade = 'facil';

function uid() { return Math.random().toString(36).slice(2, 10); }

// usa direto o relógio/fuso horário do aparelho, sem pedir nenhuma permissão
function formatarData(timestamp) {
  return new Date(timestamp).toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

function salvar() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Falha ao salvar', e);
  }
}

function carregar() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
      // migração: missões antigas sem segmento recebem "ordem" por padrão
      state.quests.forEach(q => { if (!q.segmento) q.segmento = 'ordem'; });
    }
  } catch (e) {
    console.error('Falha ao carregar', e);
  }
}

function calcularNivel(xpTotal) {
  const nivel = Math.floor(xpTotal / XP_POR_NIVEL) + 1;
  const xpAtual = xpTotal % XP_POR_NIVEL;
  return { nivel, xpAtual, xpNecessaria: XP_POR_NIVEL };
}

function montarSegRow() {
  const row = document.getElementById('segRow');
  row.innerHTML = '';
  Object.entries(SEGMENTOS).forEach(([key, s]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'seg-btn';
    btn.textContent = s.label;
    if (novoSegmento === key) {
      btn.style.borderColor = s.borda;
      btn.style.background = s.bg;
      btn.style.color = s.texto;
    }
    btn.onclick = () => { novoSegmento = key; montarSegRow(); };
    row.appendChild(btn);
  });
}

function montarDiffRow() {
  const row = document.getElementById('diffRow');
  row.innerHTML = '';
  Object.entries(DIFFICULTY).forEach(([key, d]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'diff-btn' + (novaDificuldade === key ? ' active' : '');
    btn.textContent = `${d.label} · ${d.xp} XP`;
    btn.onclick = () => { novaDificuldade = key; montarDiffRow(); };
    row.appendChild(btn);
  });
}

function mostrarToast(texto, levelup) {
  const toast = document.getElementById('toast');
  toast.textContent = texto;
  toast.className = 'toast show' + (levelup ? ' levelup' : '');
  setTimeout(() => { toast.className = 'toast'; }, 2200);
}

function flutuarXp(xp) {
  const host = document.getElementById('floaterHost');
  const span = document.createElement('span');
  span.className = 'floater';
  span.textContent = `+${xp} XP`;
  host.appendChild(span);
  setTimeout(() => span.remove(), 1200);
}

function renderCard(q) {
  const seg = SEGMENTOS[q.segmento] || SEGMENTOS.ordem;
  const card = document.createElement('div');
  card.className = 'quest-card';
  card.style.borderLeftColor = seg.borda;
  card.style.background = seg.bg;

  const check = document.createElement('button');
  check.className = 'quest-check';
  check.style.borderColor = seg.borda;
  check.style.color = seg.borda;
  check.textContent = '✓';
  check.onclick = () => concluirQuest(q.id);

  const icon = document.createElement('span');
  icon.className = 'quest-icon';
  icon.textContent = q.tipo === 'principal' ? '⚔' : '🛡';

  const body = document.createElement('div');
  body.className = 'quest-body';
  const title = document.createElement('div');
  title.className = 'quest-title';
  title.textContent = q.titulo;

  const meta = document.createElement('div');
  meta.className = 'quest-meta';
  const tag = document.createElement('span');
  tag.className = 'quest-seg-tag';
  tag.style.borderColor = seg.borda;
  tag.style.color = seg.texto;
  tag.textContent = seg.label;
  const stars = document.createElement('span');
  stars.className = 'quest-stars';
  stars.style.color = seg.borda;
  stars.textContent = '★'.repeat(DIFFICULTY[q.dificuldade].stars);
  meta.appendChild(tag);
  meta.appendChild(stars);

  body.appendChild(title);
  body.appendChild(meta);

  const dataCriacao = document.createElement('div');
  dataCriacao.className = 'quest-date';
  dataCriacao.textContent = `criada em ${formatarData(q.criadaEm)}`;
  body.appendChild(dataCriacao);

  if (q.notas && q.notas.trim()) {
    const notesEl = document.createElement('div');
    notesEl.className = 'quest-notes';
    notesEl.textContent = q.notas;

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'quest-notes-toggle';
    toggle.textContent = 'ver notas';
    toggle.onclick = () => {
      const abrindo = !notesEl.classList.contains('open');
      notesEl.classList.toggle('open');
      toggle.textContent = abrindo ? 'ocultar notas' : 'ver notas';
    };

    body.appendChild(toggle);
    body.appendChild(notesEl);
  }

  const xp = document.createElement('span');
  xp.className = 'quest-xp';
  xp.style.color = seg.texto;
  xp.textContent = `${q.xp} XP`;

  const remove = document.createElement('button');
  remove.className = 'quest-remove';
  remove.textContent = '✕';
  remove.onclick = () => removerQuest(q.id);

  card.appendChild(check);
  card.appendChild(icon);
  card.appendChild(body);
  card.appendChild(xp);
  card.appendChild(remove);
  return card;
}

function render() {
  const { nivel, xpAtual, xpNecessaria } = calcularNivel(state.xpTotal);
  const pct = Math.min(100, Math.round((xpAtual / xpNecessaria) * 100));

  document.getElementById('levelBadge').textContent = nivel;
  document.getElementById('levelLabel').textContent = `NÍVEL ${nivel}`;
  document.getElementById('xpLabel').textContent = `${xpAtual} / ${xpNecessaria} XP`;
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('completedCount').textContent = state.quests.filter(q => q.concluida).length;

  const principais = state.quests.filter(q => q.tipo === 'principal' && !q.concluida);
  const secundarias = state.quests.filter(q => q.tipo === 'secundaria' && !q.concluida);
  const concluidas = state.quests
    .filter(q => q.concluida)
    .sort((a, b) => (b.concluidaEm || 0) - (a.concluidaEm || 0))
    .slice(0, 30);

  document.getElementById('principaisCount').textContent = `(${principais.length})`;
  document.getElementById('secundariasCount').textContent = `(${secundarias.length})`;

  const principaisList = document.getElementById('principaisList');
  principaisList.innerHTML = '';
  if (principais.length === 0) {
    const div = document.createElement('div');
    div.className = 'empty-box';
    div.textContent = 'Nenhuma missão principal ativa no momento.';
    principaisList.appendChild(div);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'quest-list';
    principais.forEach(q => wrap.appendChild(renderCard(q)));
    principaisList.appendChild(wrap);
  }

  const secundariasList = document.getElementById('secundariasList');
  secundariasList.innerHTML = '';
  if (secundarias.length === 0) {
    const div = document.createElement('div');
    div.className = 'empty-box';
    div.textContent = 'Nenhuma missão secundária ativa. Adicione tarefas menores por aqui.';
    secundariasList.appendChild(div);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'quest-list';
    secundarias.forEach(q => wrap.appendChild(renderCard(q)));
    secundariasList.appendChild(wrap);
  }

  const logSection = document.getElementById('logSection');
  const logList = document.getElementById('logList');
  logList.innerHTML = '';
  if (concluidas.length > 0) {
    logSection.style.display = 'block';
    concluidas.forEach(q => {
      const seg = SEGMENTOS[q.segmento] || SEGMENTOS.ordem;

      const item = document.createElement('div');
      item.className = 'log-item';
      item.style.borderLeft = `3px solid ${seg.borda}`;

      const top = document.createElement('div');
      top.className = 'log-top';

      const left = document.createElement('div');
      left.className = 'log-top-left';
      const icon = document.createElement('span');
      icon.className = 'log-icon';
      icon.textContent = q.tipo === 'principal' ? '⚔' : '🛡';
      const t = document.createElement('span');
      t.className = 'log-title';
      t.textContent = q.titulo;
      left.appendChild(icon);
      left.appendChild(t);

      const x = document.createElement('span');
      x.className = 'log-xp';
      x.style.color = seg.texto;
      x.textContent = `+${q.xp} XP`;

      top.appendChild(left);
      top.appendChild(x);
      item.appendChild(top);

      const dates = document.createElement('div');
      dates.className = 'log-dates';
      const criada = document.createElement('span');
      criada.textContent = `criada em ${formatarData(q.criadaEm)}`;
      const concluida = document.createElement('span');
      concluida.textContent = `concluída em ${formatarData(q.concluidaEm)}`;
      dates.appendChild(criada);
      dates.appendChild(concluida);
      item.appendChild(dates);

      if (q.notas && q.notas.trim()) {
        const notesEl = document.createElement('div');
        notesEl.className = 'quest-notes';
        notesEl.textContent = q.notas;

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'quest-notes-toggle';
        toggle.textContent = 'ver notas';
        toggle.onclick = () => {
          const abrindo = !notesEl.classList.contains('open');
          notesEl.classList.toggle('open');
          toggle.textContent = abrindo ? 'ocultar notas' : 'ver notas';
        };

        item.appendChild(toggle);
        item.appendChild(notesEl);
      }

      logList.appendChild(item);
    });
  } else {
    logSection.style.display = 'none';
  }
}

function adicionarQuest(titulo, notas) {
  const nova = {
    id: uid(),
    titulo,
    notas: notas || '',
    tipo: novoTipo,
    segmento: novoSegmento,
    dificuldade: novaDificuldade,
    xp: DIFFICULTY[novaDificuldade].xp,
    concluida: false,
    criadaEm: Date.now(),
  };
  state.quests.unshift(nova);
  salvar();
  render();
}

function concluirQuest(id) {
  const q = state.quests.find(x => x.id === id);
  if (!q || q.concluida) return;

  const nivelAntes = calcularNivel(state.xpTotal).nivel;
  q.concluida = true;
  q.concluidaEm = Date.now();
  state.xpTotal += q.xp;
  salvar();
  render();
  flutuarXp(q.xp);

  const nivelDepois = calcularNivel(state.xpTotal).nivel;
  if (nivelDepois > nivelAntes) {
    mostrarToast(`★ Você subiu para o Nível ${nivelDepois}!`, true);
  } else {
    mostrarToast(`+${q.xp} XP · missão concluída`, false);
  }
}

function removerQuest(id) {
  state.quests = state.quests.filter(x => x.id !== id);
  salvar();
  render();
}

// eventos
document.getElementById('openFormBtn').onclick = () => {
  document.getElementById('formPanel').classList.add('open');
  document.getElementById('openFormBtn').style.display = 'none';
  document.getElementById('tituloInput').focus();
};
document.getElementById('cancelBtn').onclick = () => {
  document.getElementById('formPanel').classList.remove('open');
  document.getElementById('openFormBtn').style.display = 'block';
  document.getElementById('tituloInput').value = '';
  document.getElementById('notasInput').value = '';
};
document.getElementById('tipoPrincipalBtn').onclick = () => {
  novoTipo = 'principal';
  document.getElementById('tipoPrincipalBtn').className = 'toggle-btn active-main';
  document.getElementById('tipoSecundariaBtn').className = 'toggle-btn';
};
document.getElementById('tipoSecundariaBtn').onclick = () => {
  novoTipo = 'secundaria';
  document.getElementById('tipoSecundariaBtn').className = 'toggle-btn active-side';
  document.getElementById('tipoPrincipalBtn').className = 'toggle-btn';
};
document.getElementById('formPanel').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('tituloInput');
  const notasInput = document.getElementById('notasInput');
  const titulo = input.value.trim();
  if (!titulo) return;
  adicionarQuest(titulo, notasInput.value.trim());
  input.value = '';
  notasInput.value = '';
  novaDificuldade = 'facil';
  novoSegmento = 'ordem';
  montarDiffRow();
  montarSegRow();
  document.getElementById('formPanel').classList.remove('open');
  document.getElementById('openFormBtn').style.display = 'block';
};

// inicialização
carregar();
montarSegRow();
montarDiffRow();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>
